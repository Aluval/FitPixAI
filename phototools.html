<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow: hidden;
            color: white;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }
        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            opacity: 0.6;
            animation: rise 10s infinite ease-in;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0.6; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-light text-center">
    <a href="#" class="back-arrow" onclick="window.history.back();">← Back</a>
    <div class="bubbles"></div>
    <div class="container mt-5 p-4 bg-white shadow rounded">
        <h1 class="text-primary">Photo Enhancement & Editing</h1>
        <input type="file" id="photoUpload" class="form-control mb-3" accept="image/*">
        <div class="btn-group w-100">
            <button class="btn btn-info" onclick="enhancePhoto()">Enhance</button>
            <button class="btn btn-warning" onclick="upscalePhoto()">Upscale</button>
            <button class="btn btn-danger" onclick="removeBg()">Remove BG</button>
            <button class="btn btn-secondary" onclick="convertToBW()">B&W</button>
            <button class="btn btn-danger" onclick="applyRedEffect()">Red Grayscale</button>
        </div>
        <div id="outputImage" class="mt-3"></div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const bubbleContainer = document.querySelector(".bubbles");
            for (let i = 0; i < 15; i++) {
                let bubble = document.createElement("div");
                bubble.classList.add("bubble");
                let size = Math.random() * 50 + 10 + "px";
                bubble.style.width = size;
                bubble.style.height = size;
                bubble.style.left = Math.random() * 100 + "%";
                bubble.style.animationDuration = Math.random() * 5 + 5 + "s";
                bubbleContainer.appendChild(bubble);
            }
        });
    </script>
</body>
</html>
