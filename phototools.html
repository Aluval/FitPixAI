<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitPix AI - Photo Tools</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      padding: 20px;
    }
    input[type="file"], canvas, img {
      margin: 10px 0;
    }
    .btn {
      background-color: #444;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #666;
    }
    canvas {
      display: block;
      margin: 20px auto;
      max-width: 90%;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>FitPix AI - Photo Tools</h1>
  <input type="file" id="upload" accept="image/*" />
  <br />
  <button class="btn" onclick="applyFilter('enhance')">Enhance</button>
  <button class="btn" onclick="applyFilter('bw')">B&W</button>
  <button class="btn" onclick="applyFilter('redgray')">Red Grayscale</button>
  <button class="btn" onclick="applyFilter('removebg')">Remove BG</button>
  <button class="btn" onclick="resizeImage()">Resize</button>
  <hr>
  <button class="btn" onclick="applyFilter('tealorange')">Teal & Orange</button>
  <button class="btn" onclick="applyFilter('moodygreen')">Moody Dark Green</button>
  <button class="btn" onclick="applyFilter('sepia')">Sepia</button>
  <button class="btn" onclick="applyFilter('neonoir')">Neo-Noir</button>
  <button class="btn" onclick="applyFilter('warmglow')">Warm Glow</button>
  <button class="btn" onclick="applyFilter('cyberpunk')">Cyberpunk</button><canvas id="canvas"></canvas>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();

    upload.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    function applyFilter(type) {
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        switch (type) {
          case 'enhance':
            data[i] = Math.min(255, r * 1.1);
            data[i + 1] = Math.min(255, g * 1.1);
            data[i + 2] = Math.min(255, b * 1.1);
            break;
          case 'bw':
            let gray = 0.3 * r + 0.59 * g + 0.11 * b;
            data[i] = data[i + 1] = data[i + 2] = gray;
            break;
          case 'redgray':
            let redGray = (r + g + b) / 3;
            data[i] = redGray;
            data[i + 1] = 0;
            data[i + 2] = 0;
            break;
          case 'tealorange':
            data[i] = r + 30;
            data[i + 1] = g - 20;
            data[i + 2] = b + 40;
            break;
          case 'moodygreen':
            let moody = (r + g + b) / 3 * 0.9;
            data[i] = moody * 0.6;
            data[i + 1] = moody * 1.2;
            data[i + 2] = moody * 0.6;
            break;
          case 'sepia':
            let gray2 = 0.3 * r + 0.59 * g + 0.11 * b;
            data[i] = gray2 + 40;
            data[i + 1] = gray2 + 20;
            data[i + 2] = gray2;
            break;
          case 'neonoir':
            let bw = 0.3 * r + 0.59 * g + 0.11 * b > 128 ? 255 : 0;
            data[i] = data[i + 1] = data[i + 2] = bw;
            break;
          case 'warmglow':
            data[i] = r + 20;
            data[i + 1] = g + 10;
            data[i + 2] = b;
            break;
          case 'cyberpunk':
            data[i] = r * 0.8;
            data[i + 1] = g * 1.1;
            data[i + 2] = Math.min(255, b * 1.5);
            break;
        }
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function resizeImage() {
      const newWidth = prompt("Enter new width in pixels:", canvas.width);
      const newHeight = prompt("Enter new height in pixels:", canvas.height);
      if (newWidth && newHeight) {
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = newWidth;
        tempCanvas.height = newHeight;
        tempCtx.drawImage(canvas, 0, 0, newWidth, newHeight);
        canvas.width = newWidth;
        canvas.height = newHeight;
        ctx.drawImage(tempCanvas, 0, 0);
      }
    }
  </script></body>
</html>
