<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor & Compressor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center">

    <div class="container mt-5 p-4 bg-white shadow rounded">
        <h1 class="text-primary">Photo Editor & Compressor</h1>

        <!-- Upload Image -->
        <input type="file" id="photoUpload" class="form-control mb-3" accept="image/*" onchange="loadImage(event)">

        <!-- Open Camera & Capture -->
        <button class="btn btn-success w-100 mb-3" onclick="openCamera()">Open Camera</button>
        <div id="cameraSection">
            <video id="video" autoplay></video>
            <button class="btn btn-primary mt-2" onclick="capturePhoto()">Capture</button>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>

        <!-- Effect Buttons -->
        <div class="btn-group w-100 mt-3">
            <button class="btn btn-info" onclick="applyEffect('enhance')">Enhance</button>
            <button class="btn btn-secondary" onclick="applyEffect('bw')">B&W</button>
            <button class="btn btn-danger" onclick="applyEffect('red')">Red Grayscale</button>
            <button class="btn btn-warning" onclick="applyEffect('removeBg')">Remove BG</button>
            <button class="btn btn-dark" onclick="compressImage()">Reduce Size</button>
        </div>

        <!-- Output Image -->
        <div id="outputImage" class="mt-3"></div>

        <!-- File Size -->
        <div id="fileSize" class="mt-3"></div>

        <!-- Format Selection -->
        <select id="formatSelect" class="form-control mt-3">
            <option value="jpeg">JPEG</option>
            <option value="jpg">JPG</option>
            <option value="png">PNG</option>
            <option value="heic">HEIC</option>
        </select>

        <!-- Download Button -->
        <button id="downloadBtn" class="btn btn-success mt-3" style="display: none;" onclick="downloadImage()">Download</button>
    </div>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");
        let outputImage = document.getElementById("outputImage");
        let downloadBtn = document.getElementById("downloadBtn");
        let fileSizeDisplay = document.getElementById("fileSize");

        function openCamera() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; })
                .catch(err => console.error("Camera access denied:", err));
        }

        function capturePhoto() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            video.srcObject.getTracks().forEach(track => track.stop());
            displayImage(canvas.toDataURL());
        }

        function loadImage(event) {
            let reader = new FileReader();
            reader.onload = function(e) { displayImage(e.target.result); };
            reader.readAsDataURL(event.target.files[0]);
        }

        function displayImage(src) {
            outputImage.innerHTML = `<img id="editedImg" src="${src}" class="img-fluid rounded shadow">`;
            downloadBtn.style.display = "none";
            fileSizeDisplay.innerHTML = "";
        }

        async function applyEffect(effect) {
            let img = document.getElementById("editedImg");
            if (!img) return alert("Capture or upload an image first!");

            if (effect === "removeBg") {
                return removeBg();
            }

            let tempImg = new Image();
            tempImg.src = img.src;
            tempImg.onload = function () {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                canvas.width = tempImg.width;
                canvas.height = tempImg.height;
                ctx.drawImage(tempImg, 0, 0);

                let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let pixels = imgData.data;

                if (effect === "bw") {
                    for (let i = 0; i < pixels.length; i += 4) {
                        let avg = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                        pixels[i] = pixels[i + 1] = pixels[i + 2] = avg;
                    }
                } else if (effect === "red") {
                    for (let i = 0; i < pixels.length; i += 4) {
                        let avg = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
                        pixels[i] = avg;
                        pixels[i + 1] = 0;
                        pixels[i + 2] = 0;
                    }
                } else if (effect === "enhance") {
                    for (let i = 0; i < pixels.length; i += 4) {
                        pixels[i] = Math.min(255, pixels[i] * 1.2);
                        pixels[i + 1] = Math.min(255, pixels[i + 1] * 1.2);
                        pixels[i + 2] = Math.min(255, pixels[i + 2] * 1.2);
                    }
                }

                ctx.putImageData(imgData, 0, 0);
                let newSrc = canvas.toDataURL();
                displayImage(newSrc);
                downloadBtn.style.display = "block";
            };
        }

        async function removeBg() {
            const fileInput = document.getElementById("photoUpload");
            if (!fileInput.files.length) {
                alert("Please upload a photo first.");
                return;
            }
            const formData = new FormData();
            formData.append("image_file", fileInput.files[0]);
            formData.append("size", "auto");

            const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST",
                headers: { "X-Api-Key": "24Lc9RTfcMEXPx1Y7MU89afF" }, // Replace with your API key
                body: formData
            });

            if (!response.ok) {
                alert("Error removing background.");
                return;
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            displayImage(url);
            addDownloadButton(url, "removed_bg.png");
        }

        function compressImage() {
            let img = document.getElementById("editedImg");
            if (!img) return alert("Capture or upload an image first!");

            let tempImg = new Image();
            tempImg.src = img.src;
            tempImg.onload = function () {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");

                canvas.width = tempImg.width;
                canvas.height = tempImg.height;
                ctx.drawImage(tempImg, 0, 0);

                let compressedSrc = canvas.toDataURL("image/jpeg", 0.5); // Reduce quality to 50%
                displayImage(compressedSrc);

                // Show file size
                let sizeInKB = (compressedSrc.length / 1024).toFixed(2);
                let sizeInMB = (sizeInKB / 1024).toFixed(2);
                fileSizeDisplay.innerHTML = `Compressed Size: ${sizeInKB} KB / ${sizeInMB} MB`;

                addDownloadButton(compressedSrc, "compressed_image.jpg");
            };
        }

        function addDownloadButton(src, filename) {
            downloadBtn.style.display = "block";
            downloadBtn.onclick = function () {
                let link = document.createElement("a");
                link.href = src;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        }

        function downloadImage() {
            let img = document.getElementById("editedImg");
            if (!img) return;

            let format = document.getElementById("formatSelect").value;
            let mimeType = format === "heic" ? "image/heif" : `image/${format}`;

            let canvas = document.createElement("canvas");
            let ctx = canvas.getContext("2d");
            let tempImg = new Image();
            tempImg.src = img.src;

            tempImg.onload = function () {
                canvas.width = tempImg.width;
                canvas.height = tempImg.height;
                ctx.drawImage(tempImg, 0, 0);

                let imageUrl = canvas.toDataURL(mimeType, 0.8);
                let link = document.createElement("a");
                link.href = imageUrl;
                link.download = `edited_image.${format}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        }
    </script>
</body>
</html>
