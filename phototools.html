<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPix AI - Photo Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        #imagePreview {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            display: none;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FitPix AI - Photo Tools</h1>

    <!-- Image Upload -->
    <input type="file" id="photoUpload" accept="image/*" />
    
    <br>
    
    <!-- Display Image and Effects -->
    <img id="imagePreview" src="" alt="Preview" />
    
    <!-- Buttons for Effects -->
    <button onclick="enhanceImage()">Enhance</button>
    <button onclick="removeBg()">Remove Background</button>
    <button onclick="applyB&W()">B&W</button>
    <button onclick="applyRedGrayscale()">Red Grayscale</button>
    <button onclick="applyResize()">Resize</button>

    <!-- Download Button -->
    <div id="downloadBtnContainer"></div>

    <!-- Effects Options -->
    <div id="resizeOptions" style="display:none;">
        <label for="widthInput">Width:</label>
        <input type="number" id="widthInput" placeholder="Enter width" />
        <label for="heightInput">Height:</label>
        <input type="number" id="heightInput" placeholder="Enter height" />
        <button onclick="applyResize()">Apply Resize</button>
    </div>
</div>

<script>
    function displayImage(url) {
        const imagePreview = document.getElementById("imagePreview");
        imagePreview.src = url;
        imagePreview.style.display = "block";
    }

    function addDownloadButton(url, filename) {
        const downloadBtnContainer = document.getElementById("downloadBtnContainer");
        const downloadBtn = document.createElement("a");
        downloadBtn.href = url;
        downloadBtn.download = filename;
        downloadBtn.innerText = "Download " + filename;
        downloadBtn.style.display = "block";
        downloadBtn.style.marginTop = "10px";
        downloadBtnContainer.innerHTML = "";
        downloadBtnContainer.appendChild(downloadBtn);
    }

    async function removeBg() {
        const fileInput = document.getElementById("photoUpload");
        if (!fileInput.files.length) {
            alert("Please upload a photo first.");
            return;
        }
        const formData = new FormData();
        formData.append("image_file", fileInput.files[0]);
        formData.append("size", "auto");

        try {
            const response = await fetch("https://api.remove.bg/v1.0/removebg", {
                method: "POST",
                headers: { "X-Api-Key": "24Lc9RTfcMEXPx1Y7MU89afF" }, // Replace with your API key
                body: formData
            });

            if (!response.ok) {
                alert("Error removing background.");
                return;
            }

            const blob = await response.blob();

            // Convert to JPEG by drawing to a canvas
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement("canvas");
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                const jpegUrl = canvas.toDataURL("image/jpeg", 1.0); // Full quality JPEG
                displayImage(jpegUrl);
                addDownloadButton(jpegUrl, "removed_bg.jpg");
            };
            img.src = URL.createObjectURL(blob);

        } catch (error) {
            alert("Unexpected error: " + error.message);
        }
    }

    function enhanceImage() {
        // Implement cinematic effect (example)
        alert("Enhance functionality to be added.");
    }

    function applyB&W() {
        const img = document.getElementById("imagePreview");
        if (!img.src) {
            alert("Please upload an image first.");
            return;
        }
        img.style.filter = "grayscale(100%)";
    }

    function applyRedGrayscale() {
        const img = document.getElementById("imagePreview");
        if (!img.src) {
            alert("Please upload an image first.");
            return;
        }
        img.style.filter = "grayscale(100%) sepia(100%)";
    }

    function applyResize() {
        const width = document.getElementById("widthInput").value;
        const height = document.getElementById("heightInput").value;
        
        const img = document.getElementById("imagePreview");
        if (img.src && width && height) {
            img.width = width;
            img.height = height;
            addDownloadButton(img.src, "resized_image.jpg");
        } else {
            alert("Please upload an image and provide valid dimensions.");
        }
    }
</script>

</body>
</html>
