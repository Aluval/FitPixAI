<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .container {
      max-width: 420px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 2;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #ff758c;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 3;
    }
    .bubbles {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }
    .bubble {
      position: absolute;
      bottom: -50px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      opacity: 0.6;
      animation: rise 10s infinite ease-in;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.5); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="bubbles"></div>

  <div class="container text-center">
    <h2 class="text-primary mb-3">BMI Calculator</h2>
    <input type="number" id="weight" class="form-control mb-2" placeholder="Weight (kg)">
    <input type="number" id="height" class="form-control mb-3" placeholder="Height (m)" step="0.01">
    <button class="btn btn-success w-100 mb-3" onclick="calculateBMI()">Calculate BMI</button>
    <div id="result"></div>
    <canvas id="bmiChart" class="my-3"></canvas>
    <div id="dietChart" class="p-3 bg-light border rounded"></div>
  </div>

  <script>
    function calculateBMI() {
      const weight = parseFloat(document.getElementById("weight").value);
      const height = parseFloat(document.getElementById("height").value);

      if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
        alert("Please enter valid values.");
        return;
      }

      const bmi = weight / (height * height);
      let classification = "", diet = "";

      if (bmi < 18.5) {
        classification = "Underweight";
        diet = "Eat protein-rich foods, nuts, dairy, and whole grains.";
      } else if (bmi < 25) {
        classification = "Normal";
        diet = "Maintain a balanced diet with fruits, vegetables, and lean proteins.";
      } else if (bmi < 30) {
        classification = "Overweight";
        diet = "Reduce sugar intake, eat fiber-rich foods, and exercise regularly.";
      } else {
        classification = "Obese";
        diet = "Follow a strict diet plan with low carbs, high fiber, and exercise.";
      }

      document.getElementById("result").innerHTML =
        `<p><strong>BMI: ${bmi.toFixed(2)}</strong> - ${classification}</p>`;
      document.getElementById("dietChart").innerHTML =
        `<h5>Diet Tips:</h5><p>${diet}</p>`;

      updateChart(bmi);
    }

    function updateChart(bmi) {
      const ctx = document.getElementById('bmiChart').getContext('2d');
      if (window.bmiChartInstance) window.bmiChartInstance.destroy();
      window.bmiChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Underweight', 'Normal', 'Overweight', 'Obese'],
          datasets: [{
            label: 'BMI Range',
            data: [18.5, 24.9, 29.9, bmi],
            backgroundColor: ['blue', 'green', 'orange', 'red']
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true,
              suggestedMax: 40
            }
          }
        }
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      const bubbleContainer = document.querySelector(".bubbles");
      for (let i = 0; i < 15; i++) {
        let bubble = document.createElement("div");
        bubble.classList.add("bubble");
        let size = Math.random() * 50 + 10 + "px";
        bubble.style.width = size;
        bubble.style.height = size;
        bubble.style.left = Math.random() * 100 + "%";
        bubble.style.animationDuration = Math.random() * 5 + 5 + "s";
        bubbleContainer.appendChild(bubble);
      }
    });
  </script>
</body>
</html>
